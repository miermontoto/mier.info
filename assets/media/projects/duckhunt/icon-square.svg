<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- app icon cuadrado a sangre para ios/app store: crosshair ámbar sobre fondo
       de marca (#0a0c0e), SIN esquinas redondeadas ni borde (apple aplica su
       propia máscara). proporción del mark heredada de icon-dark.svg (x2). -->
  <rect width="1024" height="1024" fill="#0a0c0e"/>
  <g transform="translate(192 192) scale(40)" fill="none" stroke="#f0b040" stroke-width="1.5">
    <circle cx="8" cy="8" r="6.5"/>
    <line x1="8" y1="0" x2="8" y2="4"/>
    <line x1="8" y1="12" x2="8" y2="16"/>
    <line x1="0" y1="8" x2="4" y2="8"/>
    <line x1="12" y1="8" x2="16" y2="8"/>
    <circle cx="8" cy="8" r="1" fill="#f0b040" stroke="none"/>
  </g>
</svg>
